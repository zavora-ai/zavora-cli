[package]
name = "zavora-cli"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "Rust CLI AI agent built on ADK-Rust with provider-aware runtime, workflow orchestration, and tool safety controls"
license = "MIT"
repository = "https://github.com/zavora-ai/zavora-cli"
authors = ["Zavora AI <info@zavora.ai>"]
keywords = ["cli", "ai", "agent", "adk", "llm"]
categories = ["command-line-utilities"]
# Screenshots are for the repository's README, not the published crate: they are
# an order of magnitude larger than the source and nothing at runtime reads them.
exclude = ["docs/images/*", ".kiro/*", "docs/history/*"]

[features]
# `semantic-search` is on by default: it is a single small dependency (strsim)
# and it powers the "did you mean" hint on a failed file_edit match, which is an
# error path users actually hit. Without it the hint degrades to a prefix search.
default = ["semantic-search"]
semantic-search = ["dep:strsim"]
checkpoints = []
web-fetch = ["dep:reqwest", "dep:htmd"]
oauth = ["dep:reqwest", "dep:sha2", "dep:rand", "dep:base64", "dep:open", "dep:url"]
browser = ["dep:adk-browser"]
sandbox = ["dep:adk-sandbox"]
rag = ["dep:adk-rag"]

lsp = ["dep:lsp-types"]

[dependencies]
# ADK-Rust 2.0 crates are consumed from crates.io so that a clean checkout
# builds with no sibling repositories. To develop against a local ADK-Rust
# working tree, run `make local-adk`, which installs the ignored
# `.cargo/config.toml` from `.cargo/config.toml.local-adk`. That file carries
# a [patch.crates-io] section pointing at ../adk-rust; Cargo picks it up
# automatically and no tracked file needs editing.
adk-rust = { version = "2.0.0", features = ["standard", "openai", "anthropic", "deepseek", "groq", "ollama", "graph"] }
adk-session = { version = "2.0.0", features = ["database"] }
adk-skill = { version = "2.0.0" }
adk-memory = { version = "2.0.0", features = ["sqlite-memory"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
adk-telemetry = { version = "2.0.0", features = ["otlp"] }
adk-guardrail = { version = "2.0.0" }
adk-browser = { version = "2.0.0", optional = true }
adk-sandbox = { version = "2.0.0", optional = true }
adk-rag = { version = "2.0.0", optional = true }
adk-tool = { version = "2.0.0", features = ["http-transport"] }
anyhow = "1.0.101"
axum = { version = "0.8.6", features = ["json"] }
chrono = "0.4"
clap = { version = "4.5.58", features = ["derive", "env"] }
md5 = "0.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3"
strsim = { version = "0.11.1", optional = true }
lsp-types = { version = "0.97", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls"], optional = true }
htmd = { version = "0.1", optional = true }
keyring = "3"
sha2 = { version = "0.10", optional = true }
rand = { version = "0.9", optional = true }
base64 = { version = "0.22", optional = true }
open = { version = "5", optional = true }
url = { version = "2", optional = true }
toml = "0.8.19"
toml_edit = "0.22"
# `io-util` and `process` are declared explicitly: execute_bash drains child
# pipes and reaps process groups directly rather than relying on another
# crate in the graph to enable those features.
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
async-trait = "0.1.89"
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
rustyline = "15"
similar = "2.7"
winnow = "0.7"
ignore = "0.4"
# Features are listed explicitly rather than relying on another crate in the
# graph to enable them: this crate is both an MCP client (src/mcp.rs) and an
# MCP server over stdio (src/mcp_server.rs). It previously declared only
# transport-io and compiled solely because adk-tool happened to enable rmcp's
# client feature, which stopped applying when adk-tool moved to rmcp 3.
rmcp = { version = "3.1", features = ["client", "server", "transport-io"] }
schemars = "1"
tempfile = "3.25.0"

[dev-dependencies]

[profile.dev]
debug = 1  # line tables only (vs full debug = 2)

# Process-group signalling for shell command timeouts, so a command that exceeds
# its deadline leaves no surviving grandchildren.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
