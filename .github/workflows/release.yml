name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v1.1.5)"
        required: true
      source_ref:
        description: "Git ref to build from (branch, tag, or sha)"
        required: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      source_ref: ${{ steps.vars.outputs.source_ref }}
    steps:
      - id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            SOURCE_REF="${{ inputs.source_ref }}"
            if [[ -z "${SOURCE_REF}" ]]; then
              SOURCE_REF="${RELEASE_TAG}"
            fi
          else
            RELEASE_TAG="${{ github.ref_name }}"
            SOURCE_REF="${{ github.ref }}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Release Check
        run: make release-check

  build:
    needs: [resolve, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-arm64
          - runner: macos-14
            target: x86_64-apple-darwin
            artifact_suffix: darwin-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact_suffix: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Only the cross linker is needed. The previous version also ran
      # `dpkg --add-architecture arm64` and installed `libssl-dev:arm64`, which is
      # what broke every v2.0.0 release run: Ubuntu serves arm64 from
      # ports.ubuntu.com, not archive/security.ubuntu.com, so adding the
      # architecture without repointing the sources made each arm64 index 404 and
      # apt exited 100.
      #
      # The arm64 OpenSSL packages were never required. `openssl-sys` and
      # `native-tls` are absent from the default-feature build graph — TLS goes
      # through rustls — and the release binary links no libssl or libcrypto.
      # `gcc-aarch64-linux-gnu` and `libc6-dev-arm64-cross` are amd64-hosted cross
      # packages in the ordinary archive, so no foreign architecture is involved.
      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "${GITHUB_ENV}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zavora-cli dist/zavora-cli
          chmod +x dist/zavora-cli
          tar -czf "dist/zavora-cli-${{ needs.resolve.outputs.release_tag }}-${{ matrix.artifact_suffix }}.tar.gz" -C dist zavora-cli
          shasum -a 256 "dist/zavora-cli-${{ needs.resolve.outputs.release_tag }}-${{ matrix.artifact_suffix }}.tar.gz" > "dist/checksums-${{ matrix.artifact_suffix }}.txt"

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: dist/*

  publish-release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Build checksums manifest
        run: |
          cd dist
          rm -f checksums.txt
          shasum -a 256 *.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: zavora-cli ${{ needs.resolve.outputs.release_tag }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true

  publish-crates:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Check crates.io token
        id: cargo_token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -n "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            # An annotation and a summary line, not a plain echo. A silent skip is
            # how the v2.0.0 run reported this job green while publishing nothing,
            # which is worse than failing.
            echo "::warning title=crates.io publish skipped::CARGO_REGISTRY_TOKEN is not set, so this release was not published to crates.io."
            echo "- crates.io: **skipped**, \`CARGO_REGISTRY_TOKEN\` not set" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Setup Rust
        if: steps.cargo_token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache Cargo
        if: steps.cargo_token.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Validate Cargo version matches tag
        if: steps.cargo_token.outputs.present == 'true'
        run: |
          TAG_VERSION="${{ needs.resolve.outputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION="$(sed -n 's/^version = \"\\([^\"]*\\)\"/\\1/p' Cargo.toml | head -n 1)"
          test "${TAG_VERSION}" = "${CARGO_VERSION}"

      - name: Publish crate
        if: steps.cargo_token.outputs.present == 'true'
        run: cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    needs: [resolve, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      - name: Check npm token
        id: npm_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN}" ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=npm stage skipped::NPM_TOKEN is not set, so @zavora-ai/zavora-cli was not staged. The npm wrapper downloads release assets, so a published wrapper without them fails at install time."
            echo "- npm: **skipped**, \`NPM_TOKEN\` not set" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Setup Node
        if: steps.npm_token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # `npm stage` arrived in npm 11.19.0. The npm bundled with a Node release is
      # older than that for some time after, so pin the CLI rather than inherit
      # whichever version the runner image happens to ship.
      - name: Ensure npm supports staged publishing
        if: steps.npm_token.outputs.present == 'true'
        run: |
          npm install --global npm@^11.19.0
          npm --version
          npm stage --help >/dev/null

      - name: Validate npm package version matches tag
        if: steps.npm_token.outputs.present == 'true'
        run: |
          TAG_VERSION="${{ needs.resolve.outputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION="$(node -p "require('./npm/zavora-cli/package.json').version")"
          test "${TAG_VERSION}" = "${PKG_VERSION}"

      # Staged rather than published outright. `npm stage publish` uploads the
      # version in a non-public state and never prompts for 2FA, which is what
      # makes it usable from CI; a maintainer then approves it with 2FA, so every
      # release carries proof that a human was present. A trust relationship can be
      # configured stage-only, in which case `npm publish` from here is rejected
      # outright.
      #
      # Nothing is installable until the approval, so this job succeeding does not
      # mean the package is live. The summary says which stage id to approve.
      - name: Stage npm package
        if: steps.npm_token.outputs.present == 'true'
        working-directory: npm/zavora-cli
        run: |
          npm stage publish --access public --tag latest
          {
            echo "### npm staged, awaiting approval"
            echo
            echo "\`@zavora-ai/zavora-cli@$(node -p "require('./package.json').version")\` is staged and **not yet installable**."
            echo
            echo "A maintainer must approve it with 2FA:"
            echo
            echo '```bash'
            echo "npm stage list @zavora-ai/zavora-cli"
            echo "npm stage view <stage-id>        # inspect metadata"
            echo "npm stage download <stage-id>    # inspect the tarball"
            echo "npm stage approve <stage-id>     # publish, prompts for 2FA"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report the staged version
        if: steps.npm_token.outputs.present == 'true'
        working-directory: npm/zavora-cli
        run: npm stage list @zavora-ai/zavora-cli || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-formula:
    needs: [resolve, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}

      # The formula digest can only be computed after the tag archive exists,
      # so it is regenerated here rather than maintained by hand.
      - name: Regenerate Homebrew formula
        run: ./scripts/generate_homebrew_formula.sh "${{ needs.resolve.outputs.release_tag }}"

      - name: Verify the formula version matches the tag
        run: |
          TAG_VERSION="${{ needs.resolve.outputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          FORMULA_VERSION="$(sed -n 's|.*/tags/v\([0-9][^.]*\.[0-9]*\.[0-9]*\)\.tar\.gz.*|\1|p' Formula/zavora-cli.rb | head -n 1)"
          test "${TAG_VERSION}" = "${FORMULA_VERSION}"

      - name: Commit the regenerated formula
        run: |
          if git diff --quiet Formula/zavora-cli.rb; then
            echo "Formula already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zavora-cli.rb
          git commit -m "chore(release): refresh Homebrew formula for ${{ needs.resolve.outputs.release_tag }}"
          git push origin HEAD:main
